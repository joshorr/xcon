[project]
name = "xcon"
version = "1.1.0"
description = "Dynamic configuration retreiver."
authors = [{ name = "Josh Orr", email = "josh@orr.blue" }]
requires-python = ">=3.14,<4"
readme = "Readme.md"
keywords = [
    "settings",
    "configuration",
    "lazy",
    "boto",
    "aws",
    "secrets manager",
    "param store",
    "ssm",
]
classifiers = [
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: The Unlicense (Unlicense)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "xbool>=1.1.0,<2",
    "xloop>=1.1.0,<2",
    "xsentinels>=1.2.2,<2",
    "xinject>=1.4.1,<2",
    "xboto>=1.1.1,<2",
    "xsettings>=1.4.0,<2",
    "ciso8601>=2.3.1,<3",
]

[project.urls]
Repository = "https://github.com/joshorr/xcon"

[project.entry-points.pytest11]
xcon_pytest_plugin = "xcon.pytest_plugin"

[dependency-groups]
dev = [
    "pytest-ordering",
    "tomlkit>=0,<1",
    "pdoc3",
    "black",
    "moto",
    "boto3-stubs[essential]",
    "mkdocstrings[python]>=0,<1",
    "mkdocs-autorefs>=1,<2",
    "mkdocs-git-revision-date-plugin>=0,<1",
    "mkdocs>=1.4.2,<2",
    "mkdocs-material>=9.0.12,<10",
    "pytest>=9,<10",
    "mike>=2,<3",
    "pytest-mock>=3.10.0,<4",
    "pytest-order>=1.0.1,<2",
    "pytest-pycodestyle>=2.3.1,<3",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-name = ["xcon"]
module-root = ""

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
minversion = "6.0"

# By default, reuse db schema
# (speeds up unit test starts after first unit test run)
# If test-db schmea gets messed up, drop `--reuse-db`
# and it will recreate db next time you run unit tests.
addopts = "--verbose --pycodestyle"

testpaths = ["tests", "xcon"]
python_files = "tests.py test_*.py *_tests.py tests/*"
norecursedirs = "lib/* tests/scripts .serverless .eggs dist/* node_modules"

[tool.custom.xpublish]
extra-module-docs = ['xsentinels', 'xloop', 'xinject', 'xbool', 'xsettings']

[tool.black]
line-length = 119
target_version = ['py38']
skip-string-normalization = 1
include = '\.pyi?$'
exclude = '''
(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
  | foo.py           # also separately exclude a file named foo.py in
                     # the root of the project
)
'''
